name: birchbox
description: Birchbox is a beauty and grooming subscription-box retailer that sends members a monthly
  assortment of personalized deluxe samples across skincare, makeup, haircare, and fragrance, then lets
  them purchase full-size versions of what they like in its online shop. Originally a New York startup
  and later acquired, the brand today runs a direct-to-consumer subscription and e-commerce storefront
  at birchbox.com. It was surfaced as a portfolio company of Slow Ventures and added to the API Evangelist
  network. No public developer program, API, or documentation surface was found during enrichment.
